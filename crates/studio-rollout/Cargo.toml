[package]
name = "studio-rollout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "解析 Codex 会话记录（rollout jsonl）：token 用量、skills_read/doctrine_read、疑似绕过 MCP 的动作。不依赖 core/engine——纯外部 jsonl 格式解析，跟阶段图无关。被 studio-cli（e2e report/exec report）与 studio-skill-eval（CodexDriver）共用，两者互不依赖。"

[lib]
name = "studio_rollout"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
