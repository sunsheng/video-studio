[package]
name = "studiod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "video-studio 的唯一二进制：init / serve / doctor / emit-assets / pack / unpack / list / e2e / exec / workflows。"

[lib]
name = "studiod"
path = "src/lib.rs"

[[bin]]
name = "studiod"
path = "src/main.rs"

[dependencies]
studio-core = { path = "../studio-core" }
studio-store = { path = "../studio-store" }
studio-engine = { path = "../studio-engine" }
studio-comfy = { path = "../studio-comfy" }
studio-media = { path = "../studio-media" }
studio-mcp = { path = "../studio-mcp" }
studio-pipeline = { path = "../studio-pipeline" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
chrono.workspace = true
zip.workspace = true
toml.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile = "3"
studio-core = { path = "../studio-core", features = ["fixtures"] }
