name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 工具链
        # 版本只写在 rust-toolchain.toml 一处，这里按它安装（components 也在那里）。
        # 不用 dtolnay/rust-toolchain@stable：它会装一个当前 stable 再设为默认，
        # 而工具链文件的优先级更高，装的那个根本用不上；stable 走在钉死版本前面时
        # 反而白下一个工具链。
        # 版本打印出来——2026-09-03 那次 CI 红而本地绿，就是因为日志里看不出
        # 两边跑的不是同一个 clippy。
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo clippy --version
          cargo fmt --version

      - uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        # 端到端测试不在这里跑——它需要一个真实的 Codex 会话驱动真实的
        # MCP server，只在生产环境执行，见 docs/e2e.md。
        run: cargo test --workspace

      - name: 随包文档与代码一致
        # AGENTS.md / SKILL.md / JSON Schema 全部由代码生成。
        # 改了阶段图、工具注册表或错误码却没重新生成，这里会红。
        run: |
          cargo run -q -p studiod -- emit-assets --out assets --check
