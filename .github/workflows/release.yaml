name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（例如 v0.1.0），留空则用 dev-<短 SHA>
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: 确定版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 构建 ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: studiod
            cli_binary: studio-cli
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: studiod.exe
            cli_binary: studio-cli.exe
    steps:
      - uses: actions/checkout@v4

      - name: 工具链
        # 同 ci.yaml：版本由 rust-toolchain.toml 决定，不用浮动的 stable。
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustup target add ${{ matrix.target }}
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 构建
        run: cargo build --release -p studiod -p studio-cli --target ${{ matrix.target }}

      - name: 组装目录
        shell: bash
        run: |
          set -euo pipefail
          NAME="video-studio-${{ needs.version.outputs.version }}-${{ matrix.label }}"
          DIST="dist/video-studio"
          mkdir -p "$DIST"

          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$DIST/"
          cp "target/${{ matrix.target }}/release/${{ matrix.cli_binary }}" "$DIST/"
          cp config/default.toml "$DIST/config.toml"
          cp README.md LICENSE "$DIST/"
          echo "${{ needs.version.outputs.version }}" > "$DIST/VERSION"

          if [ "${{ runner.os }}" = "Linux" ]; then
            strip "$DIST/${{ matrix.binary }}" "$DIST/${{ matrix.cli_binary }}" || true
            cp scripts/install.sh "$DIST/install.sh"
            chmod +x "$DIST/install.sh"
          else
            cp scripts/install.ps1 "$DIST/install.ps1"
          fi

          # 随包文档由 studio-cli 生成，保证与代码同版本。studiod 本身没有
          # 子命令，不能拿来生成——见 docs/decisions/ADR-0002。
          "./$DIST/${{ matrix.cli_binary }}" emit-assets --out "$DIST/assets"
          cp "$DIST/assets/.env.example" "$DIST/.env.example"
          # 已验证 workflow 基线不是生成物，是仓库里的资产。
          cp -R assets/workflows "$DIST/assets/workflows"

          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: 打包
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'video-studio' -DestinationPath '../$NAME.zip' -Force"
          else
            zip -qr "../$NAME.zip" video-studio
          fi

      - name: 冒烟：解压到任意目录都能跑
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command "Expand-Archive -Path '$NAME.zip' -DestinationPath 'smoke' -Force"
          else
            unzip -q "$NAME.zip" -d smoke
          fi
          BIN="smoke/video-studio/${{ matrix.binary }}"
          CLI="smoke/video-studio/${{ matrix.cli_binary }}"
          chmod +x "$BIN" "$CLI" || true

          # studiod 没有子命令，冒烟只验证 --version 和一次真实的 MCP
          # initialize 握手（见 docs/decisions/ADR-0002）。
          "./$BIN" --version
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | "./$BIN" > mcp-smoke.json
          node -e "const r=require('./mcp-smoke.json'); if(r.error){console.error(r);process.exit(1)}; console.log('mcp initialize ok')"

          # 项目管理 / 开发工具全在 studio-cli 里。
          "./$CLI" --version
          "./$CLI" init smoke-work --title 冒烟
          test -f smoke-work/AGENTS.md
          test -f smoke-work/.agents/skills/script/SKILL.md
          test -f smoke-work/.codex/config.toml
          cat smoke-work/.codex/config.toml
          # 基线校验：绑定指向的节点必须都存在
          "./$CLI" workflows check --dir smoke/video-studio/assets/workflows
          # list 能找到刚建的作品
          "./$CLI" list . | grep -q 冒烟
          # doctor 在没有 ffmpeg/ComfyUI 的 runner 上只该是「注意」
          "./$CLI" doctor --json > doctor.json
          # windows runner 上 python3 未必在 PATH 里，用 node（两个平台都自带）。
          node -e "const d=require('./doctor.json'); if(!d.healthy){console.error(d);process.exit(1)}; console.log('doctor ok:', d.checks.length, '项检查')"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.zip
          retention-days: 30

  release:
    name: 发布 Release
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/*/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
