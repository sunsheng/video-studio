# video-studio 出厂默认配置。
#
# 优先级：bundle 的 .env > 程序目录的 .env > 进程环境变量 > 本文件 > PATH。
# 改这个文件会影响本机所有作品；只想改一部作品就写它自己的 .env。

[media]
# ffmpeg / ffprobe 不要求在 PATH 中。留空则按上面的顺序查找。
# ffmpeg_path = "/usr/local/bin/ffmpeg"
# ffprobe_path = "/usr/local/bin/ffprobe"

[comfy]
# ComfyUI 的入口地址，**只有一个**。多节点的分发与故障转移是那一侧的事
# （通常是个负载均衡代理），控制面不再维护节点集合、不再挑节点。
# 运行本程序的机器不需要 GPU，地址可以指向别的主机。
node = "http://127.0.0.1:9001"

# 一次往队列里压多少个镜头。入口只有一个 URL，客户端看不见后端有几个节点，
# 所以并发度只能显式给——按代理后面实际的节点数配。
concurrency = 16

timeout_secs = 1800
poll_interval_secs = 3

# 需要鉴权的代理把 Bearer token 配在 .env 的 COMFY_TOKEN 里，不写在这个文件——
# 这份配置是可以进版本库的出厂默认值，凭据不该出现在这里。

[model]
# 未指定时的核心模型系列。同一部作品的视觉、视频和声音保持同一系列。
core_family = "minimax_h3"
