# 固定模型契约。
#
# 这些组合是真机验证过的。缺失、校验失败或 OOM 时必须停下并报
# model_contract_violation，**不允许静默替换成 pruned / 量化变体**。
#
# 这份契约由控制面校验，Agent 不需要知道其中任何一个文件名。

[minimax_h3]
description = "默认核心系列。T2V / I2V（可选首尾帧）与 R2V 共用同一套编码器与 VAE。"
diffusion_t2v = "minimax_h3_fl2va_int8_convrot.safetensors"
diffusion_r2v = "minimax_h3_ref2va_int8_convrot.safetensors"
text_encoder  = "qwen3vl_32b_minimax_h3_int8_convrot.safetensors"
video_vae     = "minimax_h3_video_vae_fp16.safetensors"
audio_vae     = "minimax_h3_audio_vae_fp32.safetensors"
forbidden     = ["*_pruned_*", "qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"]

[ltx2_5]
description = "两个 Gemma 文件分别承担提示词生成和条件编码，不得互换。"
diffusion       = "ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors"
prompt_encoder  = "gemma4_e2b_it_int8_convrot.safetensors"
cond_encoder    = "gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors"
video_vae       = "ltx-2.5-video-vae-bf16.safetensors"
audio_vae       = "ltx-2.5-audio-vae-bf16.safetensors"
upscaler        = "ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors"

[wan2_2_14b]
description = "默认走官方非 Turbo 20 步分支，不加载 LoRA。与 WAN Animate 2 是不同系列。"
t2v_high     = "wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors"
t2v_low      = "wan2.2_t2v_low_noise_14B_fp8_scaled.safetensors"
i2v_high     = "wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors"
i2v_low      = "wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors"
text_encoder = "umt5_xxl_fp8_e4m3fn_scaled.safetensors"
vae          = "wan_2.1_vae.safetensors"

# 图像系列。视觉资产阶段（角色卡 / 场景卡 / 道具卡）用它出图，
# 与视频系列是两套模型，不共用。
#
# 选 FLUX.2 [dev] 而不是别的图像模型，理由有两条：
#
# 1. **参考图容量。** 卡片一致性靠参考图锚定（纯文字锁不住脸，有实测），
#    而 dev 版一次吃最多 10 张参考图，够把「已定稿的全部视图」一起挂上去
#    当锚——出第 5 个视图时前 4 个都在场，新视图必须同时与它们自洽。
# 2. **构图一致性。** 三条路真机比过（见 SPEC-0016 §2.2）：MiniMax 逐视图
#    独立采样会自己裁成中景，写了 `full body head to toe` 也没守住；FLUX.2
#    四个视图全身入画一张没漂。卡片是测量用素材，构图漂了比画面不好看更伤。
#
# 许可是 Non-Commercial，本项目自用/研究，不构成约束。见 issue #12。
#
# 下面三个文件名是 2026-09-05 在 A800 80G 那台 ComfyUI 上真机跑通四视图
# 累积锁定之后填的，与 assets/workflows/flux2_dev/{t2i,multiref_edit}.json
# 里的 loader 一致。**改这里必须同时改基线并重跑真机**，两处对不上等于
# 契约失效。
[flux2_dev]
description  = "卡片生成。t2i 出主视图，multiref_edit 挂已定稿视图累积锁定出其余视图。"
verified     = true
diffusion    = "flux2_dev_fp8mixed.safetensors"
text_encoder = "mistral_3_small_flux2_bf16.safetensors"
vae          = "flux2-vae.safetensors"
# 模板里的 Flux_2-Turbo-LoRA 与 full_encoder_small_decoder VAE 都不用：
# 前者权重不在机器上且默认关闭，后者被 flux2-vae 取代。见 SPEC-0016 §3。
forbidden    = ["Flux_2-Turbo-LoRA*", "full_encoder_small_decoder.safetensors"]

# 成片超分。`post` 拼接之前逐镜把画面超到交付规格（短边 1080）。
# 走 ComfyUI 原生节点（SeedVR2Preprocess / SeedVR2Conditioning），
# **不要装第三方 custom node**。见 SPEC-0015。
#
# 选 7B 而不是 3B：#13 定的，画质优先；一镜 42.1 秒（渲染 63.9 秒的 66%），
# 这个代价换得起。`COMFY_UPSCALE=0` 可以整条关掉。
[seedvr2]
description = "成片超分。一步采样（steps=1, cfg=1, euler, simple），tiled VAE 编解码。"
verified    = true
diffusion   = "seedvr2_7b_int8_convrot.safetensors"
vae         = "seedvr2_ema_vae_fp16.safetensors"
# 3B 是同系列的小号，画质换速度；本项目不用它，也不允许 OOM 时静默降级。
forbidden   = ["seedvr2_3b_int8_convrot.safetensors"]
